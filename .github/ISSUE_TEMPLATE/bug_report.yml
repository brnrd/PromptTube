name: Bug report
description: Report something that is broken or not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please fill in as much detail as possible so we can reproduce it quickly.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
      placeholder: The transcript button appears, but clicking it does nothing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include exact steps, URLs, and any required setup.
      placeholder: |
        1. Open a YouTube video with captions
        2. Click "Copy prompt..."
        3. Observe the result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Prompt + transcript should be copied to clipboard.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Nothing is copied and no error toast appears.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 145.0
    validations:
      required: true
  - type: input
    id: addon_version
    attributes:
      label: PromptTube version
      placeholder: 1.3.0
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that may help.
      placeholder: Attach screenshots or console errors if available.
